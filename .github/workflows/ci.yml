name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Syntax & ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bash syntax check
        run: |
          bash -n install.sh
          bash -n payload/pf-return
          bash -n payload/pf-return-sync.sh
          bash -n test/smoke.sh

      - name: ShellCheck (errors only)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck -S error \
            install.sh \
            payload/pf-return \
            payload/pf-return-sync.sh \
            test/smoke.sh

  smoke:
    name: Smoke test (netns)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq iptables iproute2

      - name: Run smoke test
        run: sudo ./test/smoke.sh
